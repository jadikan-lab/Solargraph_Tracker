<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Solargraph Quick</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <style>
    body{font-family:system-ui, -apple-system, Roboto, Arial;margin:0;height:100vh;display:flex}
    #sidebar{width:360px;padding:12px;background:#f7f7f7;overflow:auto}
    #map{flex:1}
    .preview{max-width:100%;border-radius:6px;margin:6px 0}
    label{display:block;margin:8px 0}
    button{margin-right:6px}
    li{margin:8px 0;padding:6px;border:1px solid #eee}
  </style>
</head>
<body>
  <div id="sidebar">
    <h2>Ajouter sténopé (rapide)</h2>
    <form id="form">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <button id="addPhotoBtn" type="button" style="font-size:1.05rem;padding:10px 14px">📷 Ajouter photo sténopé</button>
        <button id="saveBtn" type="button" style="font-size:1.05rem;padding:10px 14px;background:#0366d6;color:#fff;border:none;border-radius:6px">💾 Enregistrer</button>
      </div>
      <input id="photo" type="file" accept="image/*" capture="environment" style="display:none">
      <div id="photosPreview" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"></div>
      <label>Type de boîte<br>
        <select id="boxType"><option>full</option><option>medium</option><option>small</option></select>
      </label>
      <label>Diamètre (mm)<br>
        <select id="hole"><option>0.26</option><option>0.4</option><option>0.5</option></select>
      </label>
      <label>Type de papier<br>
        <select id="paperType">
          <option>Fomaspeed 311</option>
          <option>RA4 Fujichristal</option>
          <option>Ilford RC</option>
          <option>Ilford FB</option>
        </select>
      </label>
      <label>Notes<br><textarea id="notes" rows="2" style="width:100%"></textarea></label>
      <div style="margin:6px 0">
        <button id="getLoc" type="button">Capturer géoloc</button>
        <span id="locInfo">Aucune</span>
      </div>
      <!-- bottom save removed; use the big 'Enregistrer' button above -->
    </form>

    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <h3 style="margin:0">Mes sténopés</h3>
      <div style="margin-left:auto">
        <button id="tabForm">Formulaire</button>
        <button id="tabMap">Carte</button>
        <button id="exportJson">Export JSON</button>
        <button id="exportKml">Export KML</button>
        <button id="clearAll">Supprimer tout</button>
      </div>
    </div>
    <div id="storageInfo" style="font-size:0.85em;color:#666;margin-bottom:6px"></div>
    <ul id="list"></ul>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Using localforage (IndexedDB) to store entries reliably including images.
    localforage.config({name: 'solargraph_trk'})
    const KEY = 'solar_entries_v1'
    async function loadEntries(){ try { const v = await localforage.getItem(KEY); return v || [] } catch(e){ console.error(e); return [] } }
    async function saveEntries(arr){ await localforage.setItem(KEY, arr) }

    function storageUsage(){ try { const s = JSON.stringify(window._lastLocalDump||[]); return new Blob([s]).size } catch(e){ return 0 } }

    // Image compression/resizing via canvas (returns dataURL)
    function compressFileToDataURL(file, maxWidth=1200, quality=0.7){
      return new Promise((resolve, reject)=>{
        const img = new Image();
        const fr = new FileReader();
        fr.onload = ()=>{
          img.onload = ()=>{
            let w = img.width, h = img.height
            if (w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth }
            const c = document.createElement('canvas'); c.width = w; c.height = h
            const ctx = c.getContext('2d'); ctx.drawImage(img,0,0,w,h)
            try{ const dataUrl = c.toDataURL('image/jpeg', quality); resolve(dataUrl) }catch(err){ reject(err) }
          }
          img.onerror = (e)=> reject(e)
          img.src = fr.result
        }
        fr.onerror = (e)=> reject(e)
        fr.readAsDataURL(file)
      })
    }

    // Map
    const map = L.map('map').setView([46, 2], 5)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map)
    const markerLayer = L.layerGroup().addTo(map)

    async function renderMarkers(){ markerLayer.clearLayers(); const entries = await loadEntries(); window._lastLocalDump = entries; entries.forEach(e=>{ if(!e.location) return; const m = L.marker([e.location.lat,e.location.lng]); // show first photo if array
      const firstPhoto = (e.initialPhotoDataURLs && e.initialPhotoDataURLs[0]) || e.initialPhotoDataURL || null;
      const finalPhoto = e.finalPhotoDataURL || null;
      const html = `<div style="max-width:280px"><div><strong>${new Date(e.createdAt).toLocaleString()}</strong></div><div>${e.boxType} • ${e.holeDiameter_mm} mm${e.paperType?` • ${e.paperType}`:''}</div>${e.retrievalDate?`<div style="color:green">Récupéré: ${new Date(e.retrievalDate).toLocaleDateString()}</div>`:''}${firstPhoto?`<div style="margin-top:6px"><img src="${firstPhoto}" style="max-width:260px;display:block;margin-top:6px;border-radius:6px;"/></div>`:''}${finalPhoto?`<div style="margin-top:6px"><em>Photo finale:</em><img src="${finalPhoto}" style="max-width:260px;display:block;margin-top:6px;border-radius:6px;"/></div>`:''}</div>`; m.bindPopup(html); m.addTo(markerLayer) }) }

    async function renderList(){ const ul = document.getElementById('list'); ul.innerHTML=''; const entries = (await loadEntries()).slice().reverse(); window._lastLocalDump = entries;
      entries.forEach(e=>{
        const li = document.createElement('li')
        // support array of initial photos
        const firstThumb = (e.initialPhotoDataURLs && e.initialPhotoDataURLs[0]) || e.initialPhotoDataURL || '';
        li.innerHTML = `<div style="display:flex;gap:8px;align-items:flex-start"><div style="flex:1"><div><strong>${new Date(e.createdAt).toLocaleString()}</strong></div><div style="color:#555">${e.boxType} • ${e.holeDiameter_mm} mm${e.paperType?` • ${e.paperType}`:''}</div><div style="font-size:0.9em;margin-top:6px">${e.location?`${e.location.lat.toFixed(5)}, ${e.location.lng.toFixed(5)} (±${Math.round(e.location.accuracy)}m)`: 'Pas de géoloc'}</div>${e.notes?`<div style="margin-top:6px">${e.notes}</div>`:''}${e.retrievalDate?`<div style="color:green;margin-top:6px">Récupéré: ${new Date(e.retrievalDate).toLocaleDateString()}</div>`:''}</div><div style="width:120px;text-align:center">${firstThumb?`<img src="${firstThumb}" style="max-width:120px;border-radius:6px;display:block;margin-bottom:6px"/>`:''}${e.finalPhotoDataURL?`<img src="${e.finalPhotoDataURL}" style="max-width:120px;border-radius:6px;display:block;margin-top:4px"/>`:''}</div></div>`
        const btnView = document.createElement('button'); btnView.textContent='Voir'; btnView.onclick = ()=>{ if(e.location) map.setView([e.location.lat,e.location.lng],14); };
        const btnRetr = document.createElement('button'); btnRetr.textContent = e.retrievalDate ? 'Annuler récupéré' : 'Marquer récupéré'; btnRetr.onclick = async ()=>{ const all = await loadEntries(); const idx = all.findIndex(x=>x.id===e.id); if(idx!==-1){ all[idx].retrievalDate = all[idx].retrievalDate ? null : Date.now(); await saveEntries(all); await renderList(); await renderMarkers(); } };
  const btnAddFinal = document.createElement('button'); btnAddFinal.textContent='Ajouter photo finale'; btnAddFinal.onclick = ()=>openFinalUpload(e.id);
        const btnDelete = document.createElement('button'); btnDelete.textContent='Supprimer'; btnDelete.onclick = async ()=>{ if(!confirm('Supprimer cet enregistrement ?')) return; const all = (await loadEntries()).filter(x=>x.id!==e.id); await saveEntries(all); await renderList(); await renderMarkers(); }
        li.appendChild(document.createElement('br'))
        li.appendChild(btnView); li.appendChild(btnRetr); li.appendChild(btnAddFinal); li.appendChild(btnDelete);
        ul.appendChild(li);
      })
      const info = document.getElementById('storageInfo'); info.textContent = `Stockage local: approx ${new Blob([JSON.stringify(window._lastLocalDump||[])]).size} bytes`;
    }


    // final photo upload
    async function openFinalUpload(id){ const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange = async (ev)=>{ const f = ev.target.files && ev.target.files[0]; if(!f) return; try{ const dataUrl = await compressFileToDataURL(f, 1200, 0.75); const all = await loadEntries(); const idx = all.findIndex(x=>x.id===id); if(idx!==-1){ all[idx].finalPhotoDataURL = dataUrl; await saveEntries(all); await renderList(); await renderMarkers(); alert('Photo finale enregistrée localement'); } }catch(err){ console.error(err); alert('Erreur image') } }; inp.click() }

    // form handling with compression and multiple photos
    const photoInput = document.getElementById('photo'); const photosPreview = document.getElementById('photosPreview'); let lastPhotos = [];
    function renderPhotosPreview(){ photosPreview.innerHTML = ''; lastPhotos.forEach((d, i)=>{ const img = document.createElement('img'); img.src = d; img.style.maxWidth='120px'; img.style.borderRadius='6px'; img.style.display='block'; img.style.marginBottom='4px'; const holder = document.createElement('div'); holder.style.position='relative'; holder.style.display='inline-block'; holder.style.marginRight='6px'; const del = document.createElement('button'); del.textContent='×'; del.style.position='absolute'; del.style.top='2px'; del.style.right='2px'; del.style.background='rgba(0,0,0,0.6)'; del.style.color='#fff'; del.style.border='none'; del.style.borderRadius='50%'; del.style.width='22px'; del.style.height='22px'; del.onclick = ()=>{ lastPhotos.splice(i,1); renderPhotosPreview(); }; holder.appendChild(img); holder.appendChild(del); photosPreview.appendChild(holder); }) }

    photoInput.addEventListener('change', async (ev)=>{ const f = ev.target.files && ev.target.files[0]; if(!f) return; try{ const dataUrl = await compressFileToDataURL(f, 1200, 0.75); lastPhotos.push(dataUrl); renderPhotosPreview(); } catch(err){ console.error(err); alert('Erreur lors de la lecture de l\'image') } finally { photoInput.value = '' } })
    document.getElementById('addPhotoBtn').addEventListener('click', ()=>photoInput.click())

    // choose which tab to show
    document.getElementById('tabMap').addEventListener('click', ()=>{ document.getElementById('sidebar').style.display='none'; document.getElementById('map').style.display='block'; setTimeout(()=>map.invalidateSize(),200); })
    document.getElementById('tabForm').addEventListener('click', ()=>{ document.getElementById('sidebar').style.display='block'; document.getElementById('map').style.display='block'; setTimeout(()=>map.invalidateSize(),200); })

    // save new entry (big button)
    document.getElementById('saveBtn').addEventListener('click', async (ev)=>{
      ev.preventDefault(); if(lastPhotos.length === 0) return alert('Ajoute au moins une photo');
      const entries = await loadEntries(); const id = Date.now().toString(36)+Math.random().toString(36).slice(2,8);
      const entry = { id, createdAt: Date.now(), initialPhotoDataURLs: lastPhotos.slice(), location: lastLoc, boxType: document.getElementById('boxType').value, holeDiameter_mm: Number(document.getElementById('hole').value), paperType: document.getElementById('paperType').value, notes: document.getElementById('notes').value, retrievalDate: null, finalPhotoDataURL: null };
      entries.push(entry); await saveEntries(entries);
      // reset form
      lastPhotos = []; renderPhotosPreview(); document.getElementById('notes').value=''; document.getElementById('locInfo').textContent = lastLoc? `${lastLoc.lat.toFixed(5)}, ${lastLoc.lng.toFixed(5)}` : 'Aucune'; await renderList(); await renderMarkers(); alert('Enregistré localement');
    })

    // geoloc
    let lastLoc = null; document.getElementById('getLoc').addEventListener('click', ()=>{
      if(!navigator.geolocation) return alert('Géoloc non supportée');
      navigator.geolocation.getCurrentPosition(p=>{ lastLoc = {lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy}; document.getElementById('locInfo').textContent = `${lastLoc.lat.toFixed(5)}, ${lastLoc.lng.toFixed(5)} (±${Math.round(lastLoc.accuracy)}m)` }, e=>alert('Erreur géoloc: '+e.message), {enableHighAccuracy:true, timeout:10000})
    })

    // save new entry
    document.getElementById('save').addEventListener('click',async (ev)=>{ ev.preventDefault(); if(!lastDataUrl) return alert('Ajoute une photo'); const entries = await loadEntries(); const id = Date.now().toString(36)+Math.random().toString(36).slice(2,8); const entry = { id, createdAt: Date.now(), initialPhotoDataURL: lastDataUrl, location: lastLoc, boxType: document.getElementById('boxType').value, holeDiameter_mm: Number(document.getElementById('hole').value), paperType: document.getElementById('paperType').value, notes: document.getElementById('notes').value, retrievalDate: null, finalPhotoDataURL: null }; entries.push(entry); await saveEntries(entries); // reset
      photo.value=''; preview.hidden=true; lastDataUrl=null; document.getElementById('locInfo').textContent = lastLoc? `${lastLoc.lat.toFixed(5)}, ${lastLoc.lng.toFixed(5)}` : 'Aucune'; await renderList(); await renderMarkers(); alert('Enregistré localement'); })

    // export JSON and KML
    document.getElementById('exportJson').addEventListener('click', async ()=>{ const data = JSON.stringify(await loadEntries(), null, 2); const blob = new Blob([data], {type:'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'solar_entries.json'; a.click(); URL.revokeObjectURL(url); })

    document.getElementById('exportKml').addEventListener('click', async ()=>{
      const entries = (await loadEntries()).filter(e=>e.location)
      const kmlParts = ['<?xml version="1.0" encoding="UTF-8"?>', '<kml xmlns="http://www.opengis.net/kml/2.2">', '<Document>']
      entries.forEach(e=>{
        const name = `Sténopé ${new Date(e.createdAt).toLocaleDateString()}`
        const desc = `${e.boxType} • ${e.holeDiameter_mm} mm\n${e.notes||''}`
        kmlParts.push(`<Placemark><name>${escapeXml(name)}</name><description>${escapeXml(desc)}</description><Point><coordinates>${e.location.lng},${e.location.lat},0</coordinates></Point></Placemark>`)
      })
      kmlParts.push('</Document></kml>')
      const blob = new Blob([kmlParts.join('\n')], {type:'application/vnd.google-earth.kml+xml'});
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'solar_entries.kml'; a.click(); URL.revokeObjectURL(url);
    })

    function escapeXml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;') }

    // clear all
    document.getElementById('clearAll').addEventListener('click', async ()=>{ if(!confirm('Supprimer toutes les données locales ?')) return; await localforage.removeItem(KEY); await renderList(); await renderMarkers(); })

    // map fullscreen toggle
    const btnMap = document.getElementById('btnMap'); btnMap.addEventListener('click', ()=>{ const side = document.getElementById('sidebar'); if(side.style.display === 'none'){ side.style.display='block'; btnMap.textContent='Ouvrir la carte'; map.invalidateSize(); } else { side.style.display='none'; btnMap.textContent='Retour'; setTimeout(()=>map.invalidateSize(),300); } })

    // init
    (async ()=>{ await renderList(); await renderMarkers(); })();
  </script>
</body>
</html>
