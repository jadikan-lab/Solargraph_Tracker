<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Solargraph Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,Roboto,sans-serif;height:100dvh;display:flex;flex-direction:column;background:#f4f4f6}
    #header{background:#1a1a2e;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0}
    #header h1{font-size:1.05rem;flex:1}
    #authStatus{font-size:0.75rem;color:#9ecaff;white-space:nowrap}
    #authBtn{background:#0366d6;color:#fff;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:0.85rem;white-space:nowrap}
    #tabs{display:flex;background:#fff;border-bottom:2px solid #e0e0e0;flex-shrink:0}
    .tab{flex:1;padding:11px 4px;text-align:center;border:none;background:none;cursor:pointer;font-size:0.9rem;color:#666;border-bottom:3px solid transparent;margin-bottom:-2px}
    .tab.active{color:#0366d6;border-bottom-color:#0366d6;font-weight:700}
    .panel{display:none;flex:1;overflow:auto;flex-direction:column;min-height:0}
    .panel.active{display:flex}
    #panelForm{padding:14px;gap:10px}
    #panelList{padding:12px;gap:8px}
    #panelMap{padding:0}
    #map{flex:1;min-height:0}
    .btn-photo{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#0366d6;border:2px dashed #0366d6;border-radius:10px;padding:14px;font-size:1.05rem;cursor:pointer;width:100%;font-weight:600}
    .btn-photo:active{background:#e8f0fe}
    .btn-save{display:flex;align-items:center;justify-content:center;gap:8px;background:#28a745;color:#fff;border:none;border-radius:10px;padding:14px;font-size:1.1rem;font-weight:700;cursor:pointer;width:100%;margin-top:4px}
    .btn-save:active{background:#218838}
    .field label{display:block;font-size:0.8rem;font-weight:600;color:#444;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
    .field select,.field textarea{width:100%;padding:9px 10px;border:1px solid #ccc;border-radius:8px;font-size:1rem;background:#fff}
    .field textarea{resize:vertical}
    #photosPreview{display:flex;flex-wrap:wrap;gap:6px}
    .photo-thumb{position:relative}
    .photo-thumb img{width:76px;height:76px;object-fit:cover;border-radius:8px;display:block}
    .photo-thumb .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:0.75rem;line-height:20px;text-align:center;padding:0}
    #geoStatus{font-size:0.85rem;padding:6px 10px;background:#fff;border-radius:8px;border:1px solid #e0e0e0}
    #geoStatus.ok{color:#28a745;border-color:#28a745}
    #geoStatus.err{color:#dc3545;border-color:#dc3545}
    .entry-card{background:#fff;border:1px solid #e6e6e6;border-radius:10px;padding:10px;flex-shrink:0}
    .entry-card.retrieved{opacity:.65}
    .entry-head{display:flex;gap:10px}
    .entry-thumb img{width:72px;height:72px;object-fit:cover;border-radius:8px;display:block}
    .entry-info{flex:1;min-width:0}
    .entry-date{font-weight:700;font-size:0.9rem}
    .entry-meta{font-size:0.82rem;color:#555;margin-top:2px}
    .entry-notes{font-size:0.82rem;color:#333;margin-top:4px;font-style:italic}
    .retrieved-badge{color:#28a745;font-size:0.82rem;margin-top:3px;font-weight:600}
    .entry-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
    .btn-xs{background:#fff;border:1px solid #ccc;border-radius:6px;padding:5px 8px;cursor:pointer;font-size:0.8rem}
    .btn-xs.danger{color:#dc3545;border-color:#dc3545}
    #storageBar{font-size:0.75rem;color:#888;text-align:right;flex-shrink:0}
    #exportRow{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;padding-top:6px;border-top:1px solid #eee;margin-top:auto}
    .btn-out{background:#fff;border:1px solid #ccc;border-radius:6px;padding:7px 10px;cursor:pointer;font-size:0.82rem}
    .btn-danger-sm{background:#dc3545;color:#fff;border:none;border-radius:6px;padding:7px 10px;cursor:pointer;font-size:0.82rem}
    .empty{text-align:center;color:#aaa;padding:32px;font-size:0.95rem}
  </style>
</head>
<body>

<div id="header">
  <h1>🌞 Solargraph Tracker</h1>
  <span id="authStatus"></span>
  <button id="authBtn">Connexion Google</button>
</div>

<div id="tabs">
  <button class="tab active" data-tab="panelForm">📷 Ajouter</button>
  <button class="tab" data-tab="panelList">📋 Liste</button>
  <button class="tab" data-tab="panelMap">🗺 Carte</button>
</div>

<div id="panelForm" class="panel active">
  <button class="btn-photo" id="addPhotoBtn">📷 Ajouter photo(s) sténopé</button>
  <input id="photoInput" type="file" accept="image/*" capture="environment" style="display:none" multiple>
  <div id="photosPreview"></div>
  <div class="field"><label>Type de boîte</label><select id="boxType"><option>full</option><option>medium</option><option>small</option></select></div>
  <div class="field"><label>Diamètre trou (mm)</label><select id="hole"><option>0.26</option><option>0.4</option><option>0.5</option></select></div>
  <div class="field">
    <label>Type de papier</label>
    <select id="paperType">
      <option>Fomaspeed 311</option><option>RA4 Fujichristal</option><option>Ilford RC</option><option>Ilford FB</option>
    </select>
  </div>
  <div class="field"><label>Notes</label><textarea id="notes" rows="2" placeholder="Orientation, lieu, conditions…"></textarea></div>
  <div id="geoStatus">📍 Géoloc en attente…</div>
  <button class="btn-save" id="saveBtn">💾 Enregistrer le sténopé</button>
</div>

<div id="panelList" class="panel">
  <div id="storageBar"></div>
  <div id="list"></div>
  <div id="exportRow">
    <button class="btn-out" id="exportJson">⬇ JSON</button>
    <button class="btn-out" id="exportKml">⬇ KML</button>
    <button class="btn-danger-sm" id="clearAll">🗑 Tout supprimer</button>
  </div>
</div>

<div id="panelMap" class="panel">
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ══════════════════════════════════════════════════════════
// CONFIG — Remplace par ton Google OAuth2 Client ID
// Voir README.md section "Sync Google Drive" pour l'obtenir
// ══════════════════════════════════════════════════════════
const GOOGLE_CLIENT_ID = 'REPLACE_WITH_YOUR_GOOGLE_CLIENT_ID'
// ══════════════════════════════════════════════════════════

const DRIVE_SCOPE    = 'https://www.googleapis.com/auth/drive.appdata'
const DRIVE_FILENAME = 'solargraph_entries.json'
const IDB_KEY        = 'solar_entries_v3'

localforage.config({ name: 'solargraph_trk' })

let gToken       = null
let driveFileId  = null
let allEntries   = []
let pendingPhotos = []
let currentLoc   = null

// ── Local IndexedDB ─────────────────────────────────────
async function localLoad() {
  try { return (await localforage.getItem(IDB_KEY)) || [] } catch { return [] }
}
async function localSave(arr) { await localforage.setItem(IDB_KEY, arr) }

// ── Google Drive ─────────────────────────────────────────
async function driveFind() {
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}'`)
  const r = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}`,
    { headers: { Authorization: `Bearer ${gToken}` } })
  const d = await r.json()
  return d.files && d.files[0] ? d.files[0].id : null
}
async function driveRead(fid) {
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fid}?alt=media`,
    { headers: { Authorization: `Bearer ${gToken}` } })
  return r.json()
}
async function driveWrite(entries) {
  const content = JSON.stringify(entries)
  if (driveFileId) {
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
      method: 'PATCH',
      headers: { Authorization: `Bearer ${gToken}`, 'Content-Type': 'application/json' },
      body: content
    })
  } else {
    const bnd = 'solar_bnd_' + Date.now()
    const meta = JSON.stringify({ name: DRIVE_FILENAME, parents: ['appDataFolder'] })
    const body = `--${bnd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${bnd}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${bnd}--`
    const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { Authorization: `Bearer ${gToken}`, 'Content-Type': `multipart/related; boundary=${bnd}` },
      body
    })
    const d = await r.json()
    if (d.id) driveFileId = d.id
  }
}
async function syncFromDrive() {
  try {
    driveFileId = await driveFind()
    if (driveFileId) {
      allEntries = await driveRead(driveFileId)
      await localSave(allEntries)
    } else if (allEntries.length > 0) {
      await driveWrite(allEntries) // first login: push local → Drive
    }
  } catch(e) { console.error('Drive sync error:', e) }
}
async function saveAndSync(arr) {
  allEntries = arr
  await localSave(arr)
  if (gToken) { try { await driveWrite(arr) } catch(e) { console.error('Drive write:', e) } }
  renderAll()
}

// ── Google Auth ───────────────────────────────────────────
function initGoogleAuth() {
  if (GOOGLE_CLIENT_ID === 'REPLACE_WITH_YOUR_GOOGLE_CLIENT_ID') {
    const btn = document.getElementById('authBtn')
    btn.textContent = 'Sync Drive (voir README)'; btn.disabled = true; btn.style.opacity = '0.5'
    document.getElementById('authStatus').textContent = '(local uniquement)'
    return
  }
  if (typeof google === 'undefined' || !google.accounts) return
  window.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID, scope: DRIVE_SCOPE,
    callback: async resp => {
      if (resp.error) { alert('Erreur auth Google: ' + resp.error); return }
      gToken = resp.access_token
      updateAuthUI(true)
      await syncFromDrive()
      renderAll()
    }
  })
}
document.getElementById('authBtn').addEventListener('click', () => {
  if (gToken) {
    google.accounts.oauth2.revoke(gToken, () => { gToken = null; updateAuthUI(false) })
  } else {
    if (window.tokenClient) window.tokenClient.requestAccessToken()
    else alert('SDK Google non chargé, attends 2s et réessaie')
  }
})
function updateAuthUI(loggedIn) {
  document.getElementById('authBtn').textContent = loggedIn ? 'Déconnexion' : 'Connexion Google'
  document.getElementById('authStatus').textContent = loggedIn ? '✓ Sync Drive' : ''
  renderStorageBar()
}

// ── Map ───────────────────────────────────────────────────
const map = L.map('map').setView([46, 2], 5)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
}).addTo(map)
const markerLayer = L.layerGroup().addTo(map)

function renderMarkers() {
  markerLayer.clearLayers()
  allEntries.forEach(e => {
    if (!e.location) return
    const fp = (e.photos && e.photos[0]) || null
    const popup = `<div style="max-width:260px">
      <strong>${new Date(e.createdAt).toLocaleString()}</strong>
      <div>${e.boxType} · ${e.holeDiameter_mm}mm · ${e.paperType||''}</div>
      ${e.retrievalDate?`<div style="color:green">✓ Récupéré: ${new Date(e.retrievalDate).toLocaleDateString()}</div>`:''}
      ${e.notes?`<div style="margin-top:4px;font-style:italic">${e.notes}</div>`:''}
      ${fp?`<img src="${fp}" style="max-width:250px;border-radius:6px;margin-top:8px;display:block"/>`:''}
      ${e.finalPhotoDataURL?`<div style="margin-top:6px"><em>Finale:</em><img src="${e.finalPhotoDataURL}" style="max-width:250px;border-radius:6px;margin-top:4px;display:block"/></div>`:''}
    </div>`
    L.marker([e.location.lat, e.location.lng]).bindPopup(popup).addTo(markerLayer)
  })
  setTimeout(() => map.invalidateSize(), 100)
}

// ── List ──────────────────────────────────────────────────
function renderList() {
  const container = document.getElementById('list')
  container.innerHTML = ''
  if (!allEntries.length) { container.innerHTML = '<div class="empty">Aucun sténopé enregistré</div>'; return }
  allEntries.slice().reverse().forEach(e => {
    const thumb = (e.photos && e.photos[0]) || null
    const card = document.createElement('div')
    card.className = 'entry-card' + (e.retrievalDate ? ' retrieved' : '')
    card.innerHTML = `
      <div class="entry-head">
        ${thumb?`<div class="entry-thumb"><img src="${thumb}"/></div>`:''}
        <div class="entry-info">
          <div class="entry-date">${new Date(e.createdAt).toLocaleString()}</div>
          <div class="entry-meta">${e.boxType} · ${e.holeDiameter_mm}mm · ${e.paperType||''}</div>
          <div class="entry-meta">${e.location?`📍 ${e.location.lat.toFixed(4)}, ${e.location.lng.toFixed(4)} ±${Math.round(e.location.accuracy)}m`:'📍 Pas de géoloc'}</div>
          ${e.notes?`<div class="entry-notes">${e.notes}</div>`:''}
          ${e.retrievalDate?`<div class="retrieved-badge">✓ Récupéré: ${new Date(e.retrievalDate).toLocaleDateString()}</div>`:''}
        </div>
      </div>
      <div class="entry-actions"></div>`
    const act = card.querySelector('.entry-actions')
    const mk = (label, fn, danger) => { const b=document.createElement('button'); b.className='btn-xs'+(danger?' danger':''); b.textContent=label; b.onclick=fn; return b }
    act.appendChild(mk('🗺 Voir', () => { switchTab('panelMap'); if(e.location) setTimeout(()=>map.setView([e.location.lat,e.location.lng],15),300) }))
    act.appendChild(mk(e.retrievalDate?'↩ Annuler':'✓ Récupéré', async()=>{ const i=allEntries.findIndex(x=>x.id===e.id); if(i!==-1){allEntries[i].retrievalDate=allEntries[i].retrievalDate?null:Date.now(); await saveAndSync(allEntries)} }))
    act.appendChild(mk('📷 Photo finale', ()=>openFinalUpload(e.id)))
    act.appendChild(mk('🗑', async()=>{ if(!confirm('Supprimer ce sténopé ?'))return; await saveAndSync(allEntries.filter(x=>x.id!==e.id)) }, true))
    container.appendChild(card)
  })
}
function renderStorageBar() {
  const sz = new Blob([JSON.stringify(allEntries)]).size
  document.getElementById('storageBar').textContent =
    `~${(sz/1024).toFixed(1)} KB${gToken?' · ✓ sync Google Drive':' · local uniquement'}`
}
function renderAll() { renderList(); renderMarkers(); renderStorageBar() }

// ── Photos ────────────────────────────────────────────────
document.getElementById('addPhotoBtn').addEventListener('click', ()=>document.getElementById('photoInput').click())
document.getElementById('photoInput').addEventListener('change', async ev => {
  for (const f of Array.from(ev.target.files||[])) {
    try { pendingPhotos.push(await compressFile(f,1200,0.75)) } catch(e){console.error(e)}
  }
  ev.target.value=''; renderPreviews()
})
function renderPreviews() {
  const p=document.getElementById('photosPreview'); p.innerHTML=''
  pendingPhotos.forEach((d,i)=>{
    const h=document.createElement('div'); h.className='photo-thumb'
    const img=document.createElement('img'); img.src=d
    const del=document.createElement('button'); del.className='del'; del.textContent='×'
    del.onclick=()=>{pendingPhotos.splice(i,1);renderPreviews()}
    h.appendChild(img); h.appendChild(del); p.appendChild(h)
  })
}
function compressFile(file,maxWidth=1200,quality=0.75){
  return new Promise((resolve,reject)=>{
    const img=new Image(),fr=new FileReader()
    fr.onload=()=>{img.onload=()=>{let w=img.width,h=img.height;if(w>maxWidth){h=Math.round(h*maxWidth/w);w=maxWidth};const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)
  })
}
async function openFinalUpload(id){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*'
  inp.onchange=async ev=>{const f=ev.target.files&&ev.target.files[0];if(!f)return;const d=await compressFile(f,1200,0.75);const i=allEntries.findIndex(x=>x.id===id);if(i!==-1){allEntries[i].finalPhotoDataURL=d;await saveAndSync(allEntries);alert('Photo finale enregistrée')}}
  inp.click()
}

// ── Geoloc ────────────────────────────────────────────────
function startGeoloc(){
  const el=document.getElementById('geoStatus')
  if(!navigator.geolocation){el.textContent='📍 Géoloc non supportée';el.className='err';return}
  el.textContent='📍 Localisation en cours…';el.className=''
  navigator.geolocation.getCurrentPosition(
    p=>{currentLoc={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};el.textContent=`📍 ${currentLoc.lat.toFixed(5)}, ${currentLoc.lng.toFixed(5)} (±${Math.round(currentLoc.accuracy)}m)`;el.className='ok'},
    err=>{el.textContent=`📍 Erreur: ${err.message}`;el.className='err'},
    {enableHighAccuracy:true,timeout:15000}
  )
}

// ── Save ──────────────────────────────────────────────────
document.getElementById('saveBtn').addEventListener('click', async()=>{
  if(pendingPhotos.length===0){alert("Ajoute au moins une photo avant d'enregistrer");return}
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8)
  const entry={id,createdAt:Date.now(),photos:pendingPhotos.slice(),location:currentLoc,
    boxType:document.getElementById('boxType').value,
    holeDiameter_mm:Number(document.getElementById('hole').value),
    paperType:document.getElementById('paperType').value,
    notes:document.getElementById('notes').value,
    retrievalDate:null,finalPhotoDataURL:null}
  allEntries.push(entry)
  await saveAndSync(allEntries)
  pendingPhotos=[];renderPreviews();document.getElementById('notes').value=''
  alert('Sténopé enregistré !');startGeoloc()
})

// ── Export ────────────────────────────────────────────────
document.getElementById('exportJson').addEventListener('click',()=>{
  const b=new Blob([JSON.stringify(allEntries,null,2)],{type:'application/json'})
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='solar_entries.json';a.click()
})
document.getElementById('exportKml').addEventListener('click',()=>{
  const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  const parts=['<?xml version="1.0" encoding="UTF-8"?>','<kml xmlns="http://www.opengis.net/kml/2.2"><Document>']
  allEntries.filter(e=>e.location).forEach(e=>{parts.push(`<Placemark><name>${esc('Sténopé '+new Date(e.createdAt).toLocaleDateString())}</name><description>${esc(e.boxType+' · '+e.holeDiameter_mm+'mm · '+(e.paperType||'')+'\n'+(e.notes||''))}</description><Point><coordinates>${e.location.lng},${e.location.lat},0</coordinates></Point></Placemark>`)})
  parts.push('</Document></kml>')
  const b=new Blob([parts.join('\n')],{type:'application/vnd.google-earth.kml+xml'})
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='solar_entries.kml';a.click()
})
document.getElementById('clearAll').addEventListener('click',async()=>{
  if(!confirm('Supprimer TOUS les sténopés ?'))return; await saveAndSync([])
})

// ── Tabs ──────────────────────────────────────────────────
function switchTab(tabId){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tabId))
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===tabId))
  if(tabId==='panelMap')setTimeout(()=>map.invalidateSize(),200)
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)))

// ── Init ──────────────────────────────────────────────────
;(async()=>{
  allEntries=await localLoad()
  renderAll(); startGeoloc()
  const waitGsi=setInterval(()=>{
    if(typeof google!=='undefined'&&google.accounts){clearInterval(waitGsi);initGoogleAuth()}
  },400)
  setTimeout(()=>clearInterval(waitGsi),10000)
})()
</script>
</body>
</html>
